name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - run: mvn -B test -Dtest=PostgresIntegrationTest
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/nexus
          TEST_POSTGRES_USER: nexus
          TEST_POSTGRES_PASSWORD: nexus-ci
