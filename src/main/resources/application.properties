spring.application.name=nexus
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/nexus;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
nexus.demo=${NEXUS_DEMO:false}
